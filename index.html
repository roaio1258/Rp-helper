<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RP Helper</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b5cf0">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0a0a12;--side:#0d0d16;--card:#11111c;--line:#1f1f30;--tx:#eceef6;--mut:#8b8ba3;--ac:#5b5cf0;--ac2:#7d7ef5}
*{box-sizing:border-box}
body{margin:0;display:flex;min-height:100vh;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Arial,sans-serif}
aside{width:220px;background:var(--side);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;flex:none}
.logo{font-size:20px;font-weight:700;color:var(--ac2);padding:0 10px 22px}
.nav{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--mut);padding:11px 12px;border-radius:10px;font-size:15px;cursor:pointer;margin-bottom:4px}
.nav:hover{color:var(--tx)}
.nav.on{background:#17172b;border-color:#2d2d57;color:var(--tx)}
main{flex:1;padding:42px 48px;min-width:0}
h1{margin:0 0 6px;font-size:34px}
.sub{color:var(--mut);margin-bottom:22px}
#q{width:100%;padding:15px 18px;background:#0d0d17;border:1px solid var(--ac);border-radius:14px;color:var(--tx);font-size:15px;outline:none}
.bar{display:flex;gap:10px;align-items:center;margin:20px 0;flex-wrap:wrap}
.chips{display:flex;gap:10px;flex-wrap:wrap;flex:1}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 18px;border-radius:20px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 0 14px #5b5cf055}
.btn{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px}
.btn.pri{background:var(--ac);border-color:var(--ac);font-weight:600}
.btn.red{color:#ff7b8a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;position:relative;transition:.15s}
.card:hover{border-color:var(--ac);transform:translateY(-2px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tag{background:#16254d;color:#5b8cff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}
.ico{background:none;border:none;color:var(--mut);cursor:pointer;font-size:15px;padding:2px 5px}
.ico:hover{color:var(--tx)}
.card h3{margin:0 0 10px;font-size:16px;line-height:1.3}
.card p{margin:0;color:var(--mut);font-size:13px;line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--mut);padding:40px 0}
#notes{width:100%;height:60vh;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:18px;font-size:15px;resize:vertical;outline:none;font-family:inherit}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5}
.modal.show{display:flex}
.box{background:#12121e;border:1px solid var(--line);border-radius:16px;padding:24px;width:min(520px,92vw)}
.box h2{margin:0 0 16px}
.box label{display:block;color:var(--mut);font-size:12px;margin:12px 0 6px}
.box input,.box select,.box textarea{width:100%;padding:11px 12px;background:#0b0b14;border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:14px;font-family:inherit;outline:none}
.box textarea{height:130px;resize:vertical}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ac);color:#fff;padding:12px 22px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){aside{display:none}main{padding:24px 16px}}
</style>
</head>
<body>
<aside>
  <div class="logo">⚖ RP Helper</div>
  <div id="nav"></div>
</aside>

<main>
  <section id="vMain">
    <h1 id="hMain">Тексты для РП</h1>
    <div class="sub">Нажми на карточку, и текст скопируется. Вставь в чат через Ctrl+V.</div>
    <input id="q" placeholder="Поиск по названию или тексту...">
    <div class="bar">
      <div class="chips" id="chips"></div>
      <button class="btn" id="addCat">📁 Свой раздел</button>
      <button class="btn pri" id="addItem">+ Свой текст</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="vNotes" style="display:none">
    <h1>Заметки</h1>
    <div class="sub">Сохраняются автоматически.</div>
    <textarea id="notes" placeholder="Пиши здесь..."></textarea>
  </section>
</main>

<div class="modal" id="modal">
  <div class="box">
    <h2 id="mTitle">Новый текст</h2>
    <label>Раздел</label><select id="fCat"></select>
    <label>Название</label><input id="fTitle" placeholder="Например: Показать документы">
    <label>Текст для чата</label><textarea id="fText" placeholder="/me достаёт документы из кармана"></textarea>
    <div class="acts">
      <button class="btn red" id="fDel" style="margin-right:auto;display:none">Удалить</button>
      <button class="btn" id="fCancel">Отмена</button>
      <button class="btn pri" id="fSave">Сохранить</button>
    </div>
  </div>
</div>
<div id="toast">Скопировано ✓</div>

<script>
const K = 'rphelper_v2';
const $ = id => document.getElementById(id);
const DEF = {cats: [], items: [], notes: ''};
let S;
try { S = JSON.parse(localStorage.getItem(K)) || DEF; } catch (e) { S = DEF; }
let SH = {cats: [], items: []};
const cats = () => [...new Set([...SH.cats, ...S.cats])];
const items = () => [...SH.items.map((x, n) => ({...x, id: 'sh' + n, shared: true})), ...S.items];
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };

let cat = 'Все', editId = null;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function copy(text) {
  const done = () => { const t = $('toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1200); };
  const fallback = () => {
    const a = el('textarea'); a.value = text; document.body.appendChild(a);
    a.select(); document.execCommand('copy'); a.remove(); done();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function render() {
  const chips = $('chips'); chips.innerHTML = '';
  ['Все', ...cats()].forEach(c => {
    const b = el('button', 'chip' + (c === cat ? ' on' : ''), c);
    b.onclick = () => { cat = c; render(); };
    chips.appendChild(b);
  });
  const q = $('q').value.trim().toLowerCase();
  const list = items().filter(i => (cat === 'Все' || i.cat === cat) &&
    (!q || i.title.toLowerCase().includes(q) || i.text.toLowerCase().includes(q)));
  const grid = $('grid'); grid.innerHTML = '';
  if (!list.length) grid.appendChild(el('div', 'empty', 'Ничего не найдено. Добавь свой текст кнопкой выше.'));
  list.forEach(i => {
    const c = el('div', 'card');
    const top = el('div', 'top');
    top.appendChild(el('span', 'tag', i.cat));
    const tools = el('div');
    const ed = el('button', 'ico', '✎'); ed.title = 'Изменить';
    ed.onclick = e => { e.stopPropagation(); openModal(i.id); };
    const cp = el('button', 'ico', '⧉'); cp.title = 'Копировать';
    cp.onclick = e => { e.stopPropagation(); copy(i.text); };
    if (!i.shared) tools.appendChild(ed); tools.appendChild(cp); top.appendChild(tools);
    c.append(top, el('h3', '', i.title), el('p', '', i.text));
    c.onclick = () => copy(i.text);
    grid.appendChild(c);
  });
  syncNav();
}

function openModal(id) {
  editId = id || null;
  const sel = $('fCat'); sel.innerHTML = '';
  cats().forEach(c => { const o = el('option', '', c); o.value = c; sel.appendChild(o); });
  const it = S.items.find(i => i.id === id);
  $('mTitle').textContent = it ? 'Изменить текст' : 'Новый текст';
  $('fTitle').value = it ? it.title : '';
  $('fText').value = it ? it.text : '';
  sel.value = it ? it.cat : (cats().includes(cat) ? cat : cats()[0]);
  $('fDel').style.display = it ? 'block' : 'none';
  $('modal').classList.add('show');
  $('fTitle').focus();
}
const closeModal = () => $('modal').classList.remove('show');

$('addItem').onclick = () => {
  if (!cats().length) { alert('Сначала создай раздел.'); return; }
  openModal();
};
$('addCat').onclick = () => {
  const n = (prompt('Название нового раздела:') || '').trim();
  if (n && !cats().includes(n)) { S.cats.push(n); cat = n; save(); render(); }
};
$('fCancel').onclick = closeModal;
$('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
$('fSave').onclick = () => {
  const title = $('fTitle').value.trim(), text = $('fText').value.trim();
  if (!title || !text) { alert('Заполни название и текст.'); return; }
  if (editId) {
    const it = S.items.find(i => i.id === editId);
    Object.assign(it, {title, text, cat: $('fCat').value});
  } else {
    S.items.push({id: Date.now(), title, text, cat: $('fCat').value});
  }
  save(); closeModal(); render();
};
$('fDel').onclick = () => {
  if (confirm('Удалить этот текст?')) {
    S.items = S.items.filter(i => i.id !== editId);
    save(); closeModal(); render();
  }
};
$('q').oninput = render;

let view = 'main';
function syncNav() {
  const nav = $('nav'); nav.innerHTML = '';
  const add = (label, v, c) => {
    const on = view === 'notes' ? v === 'notes' : (v === 'main' && c === cat);
    const b = el('button', 'nav' + (on ? ' on' : ''), label);
    b.onclick = () => { view = v; if (v === 'main') cat = c; render(); };
    nav.appendChild(b);
  };
  add('📖 Все тексты', 'main', 'Все');
  const IC = {'Отыгровки': '🎭', 'Общение': '💬', 'ФСБ': '🕵️', 'ОПГ': '💼', 'МВД': '🚔'};
  cats().forEach(c => add((IC[c] || '📁') + ' ' + c, 'main', c));
  add('📝 Заметки', 'notes');
  $('vMain').style.display = view === 'main' ? '' : 'none';
  $('vNotes').style.display = view === 'notes' ? '' : 'none';
  $('hMain').textContent = cat === 'Все' ? 'Тексты для РП' : cat;
}
$('notes').value = S.notes || '';
$('notes').oninput = () => { S.notes = $('notes').value; save(); };

render();
fetch('texts.json', {cache: 'no-store'}).then(r => r.json()).then(d => { SH = d; render(); }).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
